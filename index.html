<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destrave Seu Potencial - Ebook Interativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- Estilos CSS --- */
        :root {
            --gold-color: #c49a6c;
            --dark-gold: #a87f55;
            --bg-cream: #f9f5eb;
            --text-dark: #3e362e;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-cream);
            background-image: radial-gradient(circle at center, #fffaf0 0%, #f2eadd 100%);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            max-width: 900px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(196, 154, 108, 0.3);
            overflow: hidden;
            border: 2px solid rgba(196, 154, 108, 0.2);
        }

        /* Área da Imagem */
        .header-image-container {
            width: 100%;
            text-align: center;
            background-color: var(--bg-cream);
            border-bottom: 3px solid var(--gold-color);
        }

        .header-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Área do Formulário */
        .purchase-section {
            padding: 40px 30px;
            text-align: center;
        }

        h2.cta-title {
            color: var(--dark-gold);
            font-size: 2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .delivery-info {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 35px;
            font-style: italic;
            background-color: #fff8ec;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
        }

        /* Inputs e Botão */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--dark-gold);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0d0b0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold-color);
        }

        .btn-buy {
            background: linear-gradient(to right, var(--gold-color), var(--dark-gold));
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(168, 127, 85, 0.4);
            width: 100%;
            max-width: 500px;
        }

        .btn-buy:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(168, 127, 85, 0.6);
        }

        .btn-buy:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #status-message {
            margin-top: 20px;
            font-weight: bold;
            min-height: 1.2em;
        }

        /* Rodapé */
        footer {
            padding: 20px;
            text-align: center;
            background-color: #fcf9f4;
            border-top: 1px solid #eee;
        }

        .insta-link {
            color: var(--dark-gold);
            text-decoration: none;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            font-weight: bold;
        }

        .insta-link i {
            margin-right: 10px;
            font-size: 1.5rem;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 600px) {
            .purchase-section { padding: 20px; }
            h2.cta-title { font-size: 1.5rem; }
            .btn-buy { font-size: 1.1rem; padding: 15px 20px; }
        }
    </style>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          // ✅ SUA PUBLIC KEY PREENCHIDA
          emailjs.init("ojl9iL8Yo3XXWXxeN");
       })();
    </script>
</head>
<body>

    <div class="container">
        <header class="header-image-container">
            <img src="image_0.png" alt="Destrave seu Potencial" class="header-image">
        </header>

        <main class="purchase-section">
            <h2 class="cta-title">Inicie Sua Jornada de Transformação</h2>

            <p class="delivery-info">
                <i class="fas fa-info-circle"></i> Após a conclusão da compra, o material será enviado para o seu e-mail cadastrado abaixo em até <strong>24 horas</strong>.
            </p>

            <form id="purchase-form">
                <div class="form-group">
                    <label for="user_name">Nome Completo:</label>
                    <input type="text" id="user_name" name="user_name" required placeholder="Digite seu nome">
                </div>

                <div class="form-group">
                    <label for="user_email">E-mail Principal:</label>
                    <input type="email" id="user_email" name="user_email" required placeholder="Seu melhor e-mail">
                </div>

                <button type="submit" class="btn-buy">
                    <i class="fas fa-lock"></i> COMPRAR AGORA - R$17,90
                </button>

                <p id="status-message"></p>
            </form>
        </main>

        <footer>
            <a href="https://instagram.com/carolangelicapsico" target="_blank" class="insta-link">
                <i class="fab fa-instagram"></i> Acesso na Bio
            </a>
        </footer>
    </div>

    <script>
        // -----------------------------------------------------------
        // CONFIGURAÇÃO COMPLETA
        // -----------------------------------------------------------
        const EMAILJS_SERVICE_ID = "carolangelicapsico"; // ✅ Seu ID de serviço
        const EMAILJS_TEMPLATE_ID = "template_i3mma1d";  // ✅ Seu ID de template
        const LINK_DE_PAGAMENTO = "https://link.picpay.com/p/1769726818697be36245850"; // ✅ Seu PicPay
        // -----------------------------------------------------------

        const form = document.getElementById('purchase-form');
        const statusMsg = document.getElementById('status-message');
        const submitBtn = form.querySelector('.btn-buy');
        const originalBtnText = submitBtn.innerHTML;

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            // Muda botão para "Processando..."
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
            submitBtn.disabled = true;
            statusMsg.style.color = "#a87f55";
            statusMsg.innerText = "Registrando seus dados...";

            // Envia o e-mail
            emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, this)
                .then(() => {
                    console.log('E-mail enviado!');
                    statusMsg.innerText = "Redirecionando para o pagamento seguro...";
                    statusMsg.style.color = "green";
                    
                    // Aguarda 1.5s e redireciona para o PicPay
                    setTimeout(() => {
                        window.location.href = LINK_DE_PAGAMENTO;
                    }, 1500);

                }, (error) => {
                    console.error('Erro:', error);
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                    statusMsg.innerText = "Erro ao conectar. Tente novamente ou contate pelo Instagram.";
                    statusMsg.style.color = "red";
                });
        });
    </script>
</body>
</html>
